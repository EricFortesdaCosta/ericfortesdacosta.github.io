<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eric Fortes | Dev.Env</title>
    <meta name="description" content="Portfólio de Eric Fortes da Costa - Desenvolvedor Fullstack" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              vs: {
                bg: '#1e1e1e',          // Editor Background
                sidebar: '#252526',     // Sidebar Background
                activity: '#333333',    // Activity Bar
                line: '#2d2d2d',        // Current Line
                text: '#d4d4d4',        // Default Text
                comment: '#6a9955',     // Comments
                blue: '#569cd6',        // Keywords
                purple: '#c586c0',      // Control Flow
                yellow: '#dcdcaa',      // Functions
                orange: '#ce9178',      // Strings
                accent: '#007acc',      // Status Bar Blue
                border: '#454545'       // Borders
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
            },
            animation: {
              'blink': 'blink 1s step-end infinite',
            },
            keyframes: {
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              }
            }
          }
        }
      }
    </script>

    <!-- Google Fonts: Inter & JetBrains Mono for code aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #1e1e1e;
        color: #d4d4d4;
        font-family: 'Inter', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #1e1e1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #424242;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4f4f4f;
      }
      ::-webkit-scrollbar-corner {
        background: #1e1e1e;
      }
      .code-font {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
